# Local stack for testing the container image: educhan plus the PostgreSQL it
# needs. `docker compose up --build` is enough; every value below has a working
# default, and anything set in a local .env overrides it.
#
#   docker compose up --build     # http://localhost:8080
#   docker compose down           # stop, keeping the volumes
#   docker compose down -v        # stop and discard the database and uploads

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: educhan
      POSTGRES_PASSWORD: educhan
      POSTGRES_DB: educhan
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to the loopback interface on 5433 so it never collides with a
    # PostgreSQL already listening on the host's 5432 (see make db-up).
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educhan -d educhan"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://educhan:educhan@db:5432/educhan?sslmode=disable
      EDUCHAN_ADDR: ":8080"
      EDUCHAN_UPLOAD_DIR: /data/uploads
      EDUCHAN_LOG_FORMAT: ${EDUCHAN_LOG_FORMAT:-json}
      # Fixed so poster IDs and secure tripcodes survive a restart. This is a
      # development value; generate a real secret for anything reachable.
      EDUCHAN_POSTER_ID_SALT: ${EDUCHAN_POSTER_ID_SALT:-local-development-salt}
      EDUCHAN_MOD_KEY: ${EDUCHAN_MOD_KEY:-dev-mod-key}
      # Institutional verification. No mail provider is configured, so codes go
      # to this container's stdout — `docker compose logs -f app` is the inbox.
      # That prints the address alongside the code, which is fine locally and
      # is why a real deployment needs a Sender first. See the README.
      EDUCHAN_VERIFY_SECRET: ${EDUCHAN_VERIFY_SECRET:-dev-verify-secret}
      # The app is published directly on the host, so no proxy hop to trust.
      EDUCHAN_TRUST_PROXY: ${EDUCHAN_TRUST_PROXY:-0}
      EDUCHAN_THREAD_COOLDOWN: ${EDUCHAN_THREAD_COOLDOWN:-30}
      EDUCHAN_POST_COOLDOWN: ${EDUCHAN_POST_COOLDOWN:-5}
      EDUCHAN_UPLOAD_COOLDOWN: ${EDUCHAN_UPLOAD_COOLDOWN:-15}
      EDUCHAN_MAX_UPLOAD_BYTES: ${EDUCHAN_MAX_UPLOAD_BYTES:-8388608}
    ports:
      - "8080:8080"
    volumes:
      # Originals and thumbnails, kept across `docker compose down`. Cloud Run
      # has no equivalent — see deploy/README.md.
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
