# Declarative Cloud Run service for educhan. Substitute the placeholders and
# apply it; see deploy/README.md for the full walkthrough.
#
#   export PROJECT_ID=… REGION=… CLOUDSQL_INSTANCE=… MEDIA_BUCKET=… IMAGE_TAG=…
#   envsubst < deploy/cloudrun/service.yaml > /tmp/educhan-service.yaml
#   gcloud run services replace /tmp/educhan-service.yaml --region "$REGION"
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: educhan
  labels:
    cloud.googleapis.com/location: ${REGION}
  # Once readers come in through a domain of your own and the run.app
  # addresses are turned off (deploy/README.md section 2.10), keep them off
  # here: applying this file without it turns them back on. Metadata takes
  # one annotations: key, so if it has one already (section 2.6's
  # invoker-iam-disabled, say), add the line under that one instead.
  # annotations:
  #   run.googleapis.com/default-url-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        # Mounts the instance's socket at /cloudsql/<connection name>. The
        # connection name is PROJECT:REGION:INSTANCE, not the instance name.
        run.googleapis.com/cloudsql-instances: ${CLOUDSQL_INSTANCE}
        # An imageboard is bursty and the container is cheap to start; cap the
        # fan-out so Cloud SQL is not overwhelmed by connection pools.
        # maxScale × EDUCHAN_DB_MAX_CONNS (4 × 3 = 12) has to fit the tier's
        # connection limit (25 on db-f1-micro) with room for a rollout and
        # jobs; deploy/README.md section 3 has the budget.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Migrations run at startup behind an advisory lock, so a slow first
      # request is possible while a new revision applies them.
      timeoutSeconds: 60
      containerConcurrency: 80
      serviceAccountName: educhan-run@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/educhan/educhan:${IMAGE_TAG}
          ports:
            # Cloud Run injects PORT to match; ConfigFromEnv honours it.
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            # Secrets. Create them first (deploy/README.md section 2.4) and grant the
            # service account roles/secretmanager.secretAccessor.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: educhan-database-url
                  key: latest
            - name: EDUCHAN_POSTER_ID_SALT
              valueFrom:
                secretKeyRef:
                  name: educhan-poster-id-salt
                  key: latest
            - name: EDUCHAN_MOD_KEY
              valueFrom:
                secretKeyRef:
                  name: educhan-mod-key
                  key: latest
            # Institutional verification is deliberately left off here: with no
            # mail Sender linked in, the development sender would print every
            # address and code into Cloud Logging. Add the secret below once a
            # real Sender exists — and not before.
            # - name: EDUCHAN_VERIFY_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: educhan-verify-secret
            #       key: latest
            # The educhan Pass is off too until it goes on sale. The five it
            # needs go on together or not at all, or the server refuses to
            # start; deploy/README.md section 2.10. Once it is on, keep them
            # here: applying this file without them takes them off the service,
            # which retires the Pass.
            # - name: EDUCHAN_PASS_SECRET
            #   valueFrom: {secretKeyRef: {name: educhan-pass-secret, key: latest}}
            # - name: EDUCHAN_STRIPE_SECRET_KEY
            #   valueFrom: {secretKeyRef: {name: educhan-stripe-secret-key, key: latest}}
            # - name: EDUCHAN_STRIPE_WEBHOOK_SECRET
            #   valueFrom: {secretKeyRef: {name: educhan-stripe-webhook-secret, key: latest}}
            # - name: EDUCHAN_STRIPE_PRICE_ID
            #   value: price_...
            # - name: EDUCHAN_PUBLIC_URL
            #   value: https://YOUR-ADDRESS
            # Only with Stripe Tax switched on in the Stripe account:
            # - name: EDUCHAN_STRIPE_AUTOMATIC_TAX
            #   value: "1"
            # To stop selling and keep what was sold working, add this one
            # later, and keep it while sales are paused: applying this file
            # without it opens them again. Retiring the Pass is a different
            # step (section 2.10).
            # - name: EDUCHAN_PASS_SALES
            #   value: paused

            # Cloud Run's front end appends the caller's address to
            # X-Forwarded-For: exactly one hop. Raising this hands clients
            # control of their own rate-limit bucket, and of the poster ID of
            # any post they send without a poster key.
            - name: EDUCHAN_TRUST_PROXY
              value: "1"
            # Attachments go to Cloud Storage, because the container filesystem
            # does not outlive the container: /tmp is the only writable path on
            # Cloud Run, and it is per-instance, in-memory, and charged against
            # the memory limit. Credentials come from the service account above
            # through Application Default Credentials — nothing to configure —
            # and it needs roles/storage.objectAdmin on this bucket and nothing
            # broader. Create the bucket and grant the role first:
            # deploy/README.md section 2.3.
            - name: EDUCHAN_MEDIA_BACKEND
              value: gcs
            - name: EDUCHAN_GCS_BUCKET
              value: ${MEDIA_BUCKET}
            # Optional; objects live at the bucket root when unset.
            - name: EDUCHAN_GCS_PREFIX
              value: media
            - name: EDUCHAN_LOG_FORMAT
              value: json
            - name: EDUCHAN_THREAD_COOLDOWN
              value: "30"
            - name: EDUCHAN_POST_COOLDOWN
              value: "5"
            - name: EDUCHAN_UPLOAD_COOLDOWN
              value: "15"
            - name: EDUCHAN_MAX_UPLOAD_BYTES
              value: "8388608"
            # Image posts are refused until originals are stripped of metadata
            # and scanned before storage. Off is the default; it is spelled out
            # so turning it on is a visible change.
            - name: EDUCHAN_UPLOADS_ENABLED
              value: "false"
            # Per-instance pool cap; see the maxScale note above.
            - name: EDUCHAN_DB_MAX_CONNS
              value: "3"
          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
  traffic:
    - percent: 100
      latestRevision: true
