<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>educhan</title>
  <meta name="description" content="Anonymous imageboard for tertiary education." />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">educhan</a>
    <span class="tagline">anonymous imageboard for tertiary education</span>
    <nav class="board-nav" id="board-nav" aria-label="Boards"></nav>
  </header>

  <div class="notice" id="notice" role="alert" hidden></div>

  <main id="main" aria-live="polite">
    <p class="muted">Loading&hellip;</p>
  </main>

  <footer class="site-footer">
    <span class="muted">
      Posts are anonymous. A per-thread ID keeps a conversation followable;
      add <code>#secret</code> to your name for a tripcode.
    </span>
  </footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
